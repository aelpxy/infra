global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

otlp:
  promote_resource_attributes:
    - rustfs.cluster.id

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["host.loopback:9100"]
        labels:
          instance: alma-server
      - targets: ["192.168.0.100:9100"]
        labels:
          instance: nixos-server

  - job_name: podman
    static_configs:
      - targets: ["podman-exporter:9882"]
        labels:
          instance: alma-server
      - targets: ["192.168.0.100:9882"]
        labels:
          instance: nixos-server

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          instance: alma-server
